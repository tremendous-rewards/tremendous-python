[tool.poetry]
name = "tremendous"
version = "5.19.0"
long_description="Python API client for Tremendous"
description = "Python API client for Tremendous"
authors = ["API Support <developers@tremendous.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tremendous-rewards/tremendous-python"
keywords = ["Api", "Gift cards", "Rewards", "Incentives", "Tremendous"]
include = ["tremendous/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"

urllib3 = ">= 2.1.0"
python-dateutil = ">=2.8.2"
pydantic = ">=2"
typing-extensions = ">=4.7.1"

[tool.poetry.dev-dependencies]
pytest = ">=7.2.1"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"
